name: iOS — TestFlight

# Her main push'ta: Flutter iOS release build + fastlane match (readonly) +
# gym + pilot. Harçlıklarım `ios-testflight.yml`'den türetildi (2026-10-19); GoogleService,
# Supabase define'ları ve uzantı adımları bu uygulamada yok.
#
# İki yol (2026-10-24, yasin: "Unity ile değiştirelim menüleri ve tüm oyunu"):
#   - Unity lisans secret'ları (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD) VARSA → Unity yolu:
#     ubuntu'da game-ci/unity-builder Xcode projesini üretir (artifact), macOS'ta fastlane
#     `beta_unity` imzalar ve TestFlight'a yükler. Aynı bundle id, aynı build numarası sırası.
#   - YOKSA → Flutter + WebView yolu bugünkü gibi çalışır, kapı bir ::notice:: bırakır.
# Neden kapıyla seçim, ayrı workflow değil: iki yol aynı bundle id'ye yükler; aynı push'ta ikisi
# birden koşarsa build numarası yarışır ve testçiye hangisinin en üstte olduğu rastlantı olur.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'store_listing/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secrets kapısı (ubuntu, saniyeler): Apple secret'ları girilmeden macOS
  # runner'ı hiç başlamaz. Neden: depo PRIVATE, macOS dakikası GitHub kotasında
  # 10× sayılır; kırmızı düşecek bir build 20–30 dk × 10 = kotanın yarısı.
  # Secret'lar `if:` içinde doğrudan okunamaz, bu yüzden ayrı iş + çıktı.
  kapi:
    runs-on: ubuntu-latest
    outputs:
      hazir: ${{ steps.k.outputs.hazir }}
      unity: ${{ steps.k.outputs.unity }}
    steps:
      - id: k
        env:
          ASC: ${{ secrets.ASC_KEY_ID }}
          MATCH: ${{ secrets.MATCH_PASSWORD }}
          U_LIC: ${{ secrets.UNITY_LICENSE }}
          U_MAIL: ${{ secrets.UNITY_EMAIL }}
          U_PASS: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$ASC" ] && [ -n "$MATCH" ]; then
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple secret'ları yok — TestFlight adımı atlandı (YAPMAN_GEREKENLER.md adım 3–4)."
          fi
          # Yalnız varlık denetlenir; değer hiçbir yere basılmaz.
          if [ -n "$U_LIC" ] && [ -n "$U_MAIL" ] && [ -n "$U_PASS" ]; then
            echo "unity=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity lisans secret'ları var — TestFlight build'i Unity projesinden (unity/BirdieSmash) çıkar."
          else
            echo "unity=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity secret'ları eksik (UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD) — Flutter + WebView yolu çalışır (YAPMAN_GEREKENLER.md › Unity build'i)."
          fi

  build_and_upload:
    needs: kapi
    if: needs.kapi.outputs.hazir == 'true' && needs.kapi.outputs.unity != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sürüm sabit (Harçlıklarım ile aynı karar): stable ilerleyince analyze kendiliğinden kırılmasın.
          flutter-version: 3.47.2
          cache: true

      - name: Set up Ruby (fastlane + cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Flutter dependencies
        run: flutter pub get

      # Eklentiler Swift Package Manager ile gelir (Flutter 3.47 varsayılanı),
      # depoda Podfile yok; `pod install` Podfile'sız kırılıyordu. bundle
      # install yine gerekli (fastlane). Bir eklenti CocoaPods isterse Flutter
      # Podfile üretir ve adım kendiliğinden çalışır.
      - name: CocoaPods install
        working-directory: ios
        run: |
          bundle install
          if [ -f Podfile ]; then bundle exec pod install; else echo "Podfile yok (SwiftPM) — pod install atlandı"; fi

      - name: Flutter iOS release build (no codesign — fastlane resigns)
        run: flutter build ios --release --no-codesign

      - name: Fastlane beta (match + gym + TestFlight)
        working-directory: ios
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdiesmash-ios-ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore

  # ---- Unity yolu -------------------------------------------------------------------------------
  # 1/2: Xcode projesini ubuntu'da üret. Neden ubuntu: Unity Editor'ü macOS runner'a kurmak her
  # build'de ~10 dk × 10 kota; GameCI'nin hazır iOS imajı (unityci/editor:ubuntu-6000.0.58f2-ios-*)
  # Linux dakikasıyla çalışır, macOS yalnız Xcode derleme + imza + yükleme için açılır.
  unity_xcode:
    needs: kapi
    if: needs.kapi.outputs.hazir == 'true' && needs.kapi.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # iOS imajı ~5,6 GB, Library + Xcode projesi birkaç GB daha; runner'ın boş diski buna dar.
      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Library = Unity'nin içe aktarma önbelleği; yoksa her build FBX'leri ve shader'ları baştan işler.
      - name: Unity Library önbelleği
        uses: actions/cache@v4
        with:
          path: unity/BirdieSmash/Library
          key: unity-library-ios-${{ hashFiles('unity/BirdieSmash/Assets/**', 'unity/BirdieSmash/Packages/**', 'unity/BirdieSmash/ProjectSettings/**') }}
          restore-keys: |
            unity-library-ios-

      - name: Unity iOS build (Xcode projesi)
        id: unity1
        # Sürüm sabit: v6 yeni ana sürüm, girdileri bu dosyada denenmedi.
        # continue-on-error: kırılırsa sonraki adım IL2CPP çökmesi mi diye bakar; değilse iş orada kırılır.
        continue-on-error: true
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.58f2
          targetPlatform: iOS
          projectPath: unity/BirdieSmash
          buildMethod: BirdieSmash.EditorTools.CiBuild.iOS
          # Sürüm adı/build numarası fastlane'de (TestFlight son numara + 1); git etiketi aranmasın.
          versioning: None

      # IL2CPP yeniden denemesi (2026-10-29, Ar-Ge 3): il2cpp --convert-to-cpp ara sıra SIGSEGV (exit 139) ile düşüyor,
      # aynı commit yeniden denemede geçiyor (25 Eki run 45, 29 Eki PR #7). CiBuild.iOS yalnız günlükte "il2cpp" ve
      # "Segmentation fault" aynı iletideyse build/iOS/il2cpp_cokme.txt yazar. Yalnız o zaman, yalnız bir kez yeniden
      # denenir; C# derleme hatası ya da başka kırılma burada kırmızı kalır.
      - name: IL2CPP çökmesi mi?
        id: cokme
        if: steps.unity1.outcome == 'failure'
        run: |
          if [ -f build/iOS/il2cpp_cokme.txt ]; then
            echo "::warning::IL2CPP çöktü (Segmentation fault); bir kez yeniden deneniyor"
            sudo rm -rf build/iOS
            echo "yeniden=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unity iOS build kırıldı (IL2CPP çökmesi değil, yeniden denenmez)"
            exit 1
          fi

      - name: Unity iOS build (yeniden deneme)
        if: steps.cokme.outputs.yeniden == 'true'
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.58f2
          targetPlatform: iOS
          projectPath: unity/BirdieSmash
          buildMethod: BirdieSmash.EditorTools.CiBuild.iOS
          # Sürüm adı/build numarası fastlane'de (TestFlight son numara + 1); git etiketi aranmasın.
          versioning: None

      # tar: upload-artifact çalıştırılabilir bitlerini düşürür; Xcode projesindeki betikler
      # (process_symbols.sh, il2cpp araçları) bitsiz kalırsa macOS'ta derleme kırılır.
      - name: Xcode projesini paketle
        run: |
          test -d build/iOS/iOS/Unity-iPhone.xcodeproj || { echo "::error::Unity Xcode projesi üretilmedi (build/iOS/iOS)"; exit 1; }
          sudo tar -C build/iOS -cf unity-ios-xcode.tar iOS
          ls -lh unity-ios-xcode.tar

      - uses: actions/upload-artifact@v4
        with:
          name: unity-ios-xcode
          path: unity-ios-xcode.tar
          retention-days: 3
          if-no-files-found: error

  # 2/2: macOS'ta imzala, derle, TestFlight'a yükle (match readonly + ASC anahtarı, `beta` ile aynı).
  unity_upload:
    needs: [kapi, unity_xcode]
    if: needs.kapi.outputs.hazir == 'true' && needs.kapi.outputs.unity == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unity-ios-xcode

      - name: Xcode projesini aç
        run: |
          mkdir -p "$RUNNER_TEMP/unity"
          tar -C "$RUNNER_TEMP/unity" -xf unity-ios-xcode.tar
          rm unity-ios-xcode.tar
          echo "UNITY_XCODE_DIR=$RUNNER_TEMP/unity/iOS" >> "$GITHUB_ENV"

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Fastlane beta_unity (match + gym + TestFlight)
        working-directory: ios
        timeout-minutes: 60
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane beta_unity

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdiesmash-unity-ios-ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore
