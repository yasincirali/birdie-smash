name: iOS — Setup Match (one-time)

# TEK SEFERLİK, elle tetiklenir. com.birdiesmash.app için App Store
# provisioning profili üretip match deposuna (MATCH_GIT_URL)
# yazar. Sertifika takım geneli tektir; yalnız profil eklenir.
# Önkoşul: bundle id Apple Developer'da kayıtlı olmalı.
# 2026-11-11: "force" girdisi işaretlenirse var olan profil yeniden üretilir (App ID yeteneği sonradan açıldığında).

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Profili yeniden üret (App ID'ye Game Center / iCloud eklendikten sonra işaretle)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios
      - name: Run match (create profile + push to cert repo)
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "false"
          MATCH_FORCE: ${{ inputs.force }}
        run: bundle exec fastlane setup_match_certificates
