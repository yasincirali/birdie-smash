name: Unity — ekran görüntüleri

# Gerçek Unity render'ı (2026-10-25, yasin build 38 incelemesi: "her turda düzelt ss al"). Bulutta Unity Editor'ü ve
# cihaz yok; bu iş aynı sahneyi Linux oyuncusu olarak derler, xvfb + Mesa (yazılım GL) altında `-bsekran` ile koşar
# (Game/EkranTuru.cs) ve PNG'leri + rapor.txt'yi `ekran-sonuc` dalına run numarasıyla yazar. TestFlight'a dokunmaz.
# Tetik: `ekran/**` dallarına push (main'e değil: main push'u TestFlight build'i demek).

on:
  push:
    branches: ['ekran/**']
    paths: ['unity/**', '.github/workflows/unity-ekran.yml']
  workflow_dispatch:

concurrency:
  group: unity-ekran-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # restore/save ayrı: sonraki adım kırılsa da (ilk derleme ~33 dk) önbellek kaydedilsin.
      - name: Unity Library önbelleği (geri yükle)
        uses: actions/cache/restore@v4
        with:
          path: unity/BirdieSmash/Library
          key: unity-library-linux-${{ hashFiles('unity/BirdieSmash/Assets/**', 'unity/BirdieSmash/Packages/**') }}
          restore-keys: |
            unity-library-linux-

      - name: Unity Linux oyuncusu
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.58f2
          targetPlatform: StandaloneLinux64
          projectPath: unity/BirdieSmash
          buildMethod: BirdieSmash.EditorTools.CiBuild.Linux
          buildName: BirdieSmash
          versioning: None

      - name: Unity Library önbelleği (kaydet)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: unity/BirdieSmash/Library
          key: unity-library-linux-${{ hashFiles('unity/BirdieSmash/Assets/**', 'unity/BirdieSmash/Packages/**') }}

      - name: xvfb altında ekran turu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          ls -la build/StandaloneLinux64 || true
          EXE=$(ls build/StandaloneLinux64/BirdieSmash* | grep -v '_Data' | head -1)
          sudo chmod -R a+rwX build
          mkdir -p "$RUNNER_TEMP/ekran"
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 900 xvfb-run -a -s "-screen 0 600x1300x24" "$EXE" -screen-width 590 -screen-height 1278 -screen-fullscreen 0 \
            -force-glcore -logFile "$RUNNER_TEMP/ekran/player.log" -bsekran "$RUNNER_TEMP/ekran" || echo "oyuncu çıkış kodu $?"
          ls -la "$RUNNER_TEMP/ekran"
          tail -50 "$RUNNER_TEMP/ekran/player.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-ekran
          path: ${{ runner.temp }}/ekran
          retention-days: 5

      # Sonuçlar ayrı dala (bulut oturumu artifact indiremiyor, dalı çekebiliyor): ekran-sonuc/<run>/
      - name: ekran-sonuc dalına yaz
        if: always()
        run: |
          git config user.name "birdie-ekran"; git config user.email "ekran@users.noreply.github.com"
          # Ayrı çalışma ağacı: Unity'nin değiştirdiği dosyalar (manifest, ProjectVersion) checkout'u bozmasın.
          git fetch origin ekran-sonuc
          W="$RUNNER_TEMP/sonuc"; git worktree add -B ekran-sonuc "$W" origin/ekran-sonuc
          D="r${{ github.run_number }}"; mkdir -p "$W/$D"; cp -r "$RUNNER_TEMP/ekran/." "$W/$D/" || true
          echo "${{ github.sha }}" > "$W/$D/sha.txt"
          cd "$W" && git add "$D" && git commit -qm "ekran $D (${{ github.sha }})" && git push -q origin ekran-sonuc
