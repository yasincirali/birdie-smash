name: Unity — ekran görüntüleri

# Gerçek Unity render'ı (2026-10-25, yasin build 38 incelemesi: "her turda düzelt ss al"). Bulutta Unity Editor'ü ve
# cihaz yok; bu iş aynı sahneyi Linux oyuncusu olarak derler, xvfb + Mesa (yazılım GL) altında `-bsekran` ile koşar
# (Game/EkranTuru.cs) ve PNG'leri + rapor.txt'yi `ekran-sonuc` dalına run numarasıyla yazar. TestFlight'a dokunmaz.
# Tetik: `ekran/**` dallarına push (main'e değil: main push'u TestFlight build'i demek).

on:
  push:
    branches: ['ekran/**']
    paths: ['unity/**', '.github/workflows/unity-ekran.yml']
  workflow_dispatch:

concurrency:
  group: unity-ekran-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 2026-10-29: mağaza kareleri ayrı oyuncu çalıştırması (~10-20 dk eklenir)
    steps:
      - uses: actions/checkout@v4

      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # restore/save ayrı: sonraki adım kırılsa da (ilk derleme ~33 dk) önbellek kaydedilsin.
      - name: Unity Library önbelleği (geri yükle)
        uses: actions/cache/restore@v4
        with:
          path: unity/BirdieSmash/Library
          # 2026-10-26 gece (ekran/menu): r24'ten beri birçok dalda menü USS'siz çıktı (kod değişmeyen dallarda da); önbellek
          # şüphesi: v2 öneki temiz Library ile başlar.
          key: unity-library-linux-v2-${{ hashFiles('unity/BirdieSmash/Assets/**', 'unity/BirdieSmash/Packages/**') }}
          restore-keys: |
            unity-library-linux-v2-

      - name: Unity Linux oyuncusu
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.58f2
          targetPlatform: StandaloneLinux64
          projectPath: unity/BirdieSmash
          buildMethod: BirdieSmash.EditorTools.CiBuild.Linux
          buildName: BirdieSmash
          versioning: None

      - name: Unity Library önbelleği (kaydet)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: unity/BirdieSmash/Library
          key: unity-library-linux-v2-${{ hashFiles('unity/BirdieSmash/Assets/**', 'unity/BirdieSmash/Packages/**') }}

      - name: xvfb altında ekran turu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          ls -la build/StandaloneLinux64 || true
          EXE=$(ls build/StandaloneLinux64/BirdieSmash* | grep -v '_Data' | head -1)
          sudo chmod -R a+rwX build
          mkdir -p "$RUNNER_TEMP/ekran"
          export LIBGL_ALWAYS_SOFTWARE=1
          sudo apt-get install -y -qq gdb > /dev/null || true
          # 2026-10-27 (duyarlı yerleşim): ekran 800 genişlik; EkranTuru.DuyarliTuru 768×1024 (iPad) pencere açar, 600 dar kalıyordu.
          # 2026-10-27 ikinci tur: altı dal yeni kare ekledi (r42 832 sn); sınır 1500 → 2400 sn, iş sınırı 60 dk.
          timeout 2400 xvfb-run -a -s "-screen 0 800x1300x24" "$EXE" -screen-width 390 -screen-height 845 -screen-fullscreen 0 \
            -force-glcore -logFile "$RUNNER_TEMP/ekran/player.log" -bsekran "$RUNNER_TEMP/ekran" &
          # Takılma tanısı: 150 sn sonra hâlâ ilk karelerdeyse yığın dökümü (gdb, tüm iş parçacıkları).
          sleep 150
          P=$(pgrep -x BirdieSmash | head -1)
          if [ -n "$P" ]; then sudo gdb -p "$P" -batch -ex "thread apply all bt 25" > "$RUNNER_TEMP/ekran/yigin.txt" 2>&1 || true; fi
          wait || echo "oyuncu çıkış kodu $?"
          ls -la "$RUNNER_TEMP/ekran"
          grep -E "EkranTuru|Exception|Error" "$RUNNER_TEMP/ekran/player.log" | grep -v ALSA | tail -60 || true

      # Mağaza görselleri adım 1 (2026-10-29, Game/MagazaTuru.cs): ayrı oyuncu çalıştırması, 6,9" boyunda (1320×2868)
      # pencere; xvfb ekranı ondan büyük açılır. Kareler ekran/magaza/ altına; 6,5" ve başlık yazısı tool/magaza_gorsel.py.
      - name: mağaza kareleri
        if: always()
        run: |
          EXE=$(ls build/StandaloneLinux64/BirdieSmash* | grep -v '_Data' | head -1)
          [ -n "$EXE" ] || { echo "oyuncu yok"; exit 0; }
          mkdir -p "$RUNNER_TEMP/ekran/magaza"
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1400x3000x24" "$EXE" -screen-width 390 -screen-height 845 -screen-fullscreen 0 \
            -force-glcore -logFile "$RUNNER_TEMP/ekran/magaza/player.log" -bsekran "$RUNNER_TEMP/ekran/magaza" -bskip magaza || echo "mağaza oyuncusu çıkış kodu $?"
          ls -la "$RUNNER_TEMP/ekran/magaza"
          grep -E "EkranTuru|Exception|Error" "$RUNNER_TEMP/ekran/magaza/player.log" | grep -v ALSA | tail -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-ekran
          path: ${{ runner.temp }}/ekran
          retention-days: 5

      # Sonuçlar ayrı dala (bulut oturumu artifact indiremiyor, dalı çekebiliyor): ekran-sonuc/<run>/
      - name: ekran-sonuc dalına yaz
        if: always()
        run: |
          git config user.name "birdie-ekran"; git config user.email "ekran@users.noreply.github.com"
          # Ayrı çalışma ağacı: Unity'nin değiştirdiği dosyalar (manifest, ProjectVersion) checkout'u bozmasın.
          git fetch origin ekran-sonuc
          W="$RUNNER_TEMP/sonuc"; git worktree add -B ekran-sonuc "$W" origin/ekran-sonuc
          D="r${{ github.run_number }}"; mkdir -p "$W/$D"; cp -r "$RUNNER_TEMP/ekran/." "$W/$D/" || true
          echo "${{ github.sha }}" > "$W/$D/sha.txt"
          cd "$W" && git add "$D" && git commit -qm "ekran $D (${{ github.sha }})" && git push -q origin ekran-sonuc
